<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONNY | Mon Compte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding-bottom: 100px; }
        
        /* Header avec ton image IMG_3730.jpeg */
        .profile-header {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('IMG_3730.jpeg');
            background-size: cover;
            background-position: center;
            height: 220px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 2.5rem;
            border-bottom-right-radius: 2.5rem;
        }

        .avatar-circle {
            width: 75px; height: 75px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255,255,255,0.5);
            margin-bottom: 10px;
        }

        /* Carte de solde */
        .balance-card {
            background: white;
            border-radius: 25px;
            margin: -45px 20px 20px 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #f0f0f0;
            position: relative;
            z-index: 10;
        }

        /* Menu Icônes - Style identique au Dashboard */
        .icon-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f5f5f5;
        }
        .icon-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .icon-item i { font-size: 28px; color: #9ca3af; }
        .icon-item span { font-size: 10px; color: #6b7280; font-weight: bold; text-transform: uppercase; }

        /* Équipements */
        .product-card {
            background: #f9fafb;
            border: 1px solid #f0f0f0;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Navigation basse */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid #eee; z-index: 1000;
        }
        .nav-link { text-align: center; color: #9ca3af; font-size: 11px; text-decoration: none; font-weight: bold; }
        .nav-link.active { color: #000; }
    </style>
</head>
<body>

    <div class="profile-header">
        <div class="avatar-circle">
            <i class="fas fa-user text-3xl"></i>
        </div>
        <h2 class="font-black italic text-xl uppercase tracking-tighter">Partenaire Sonny</h2>
        <p class="text-[10px] opacity-80 tracking-[0.3em]">+243 ID: 810000000</p>
    </div>

    <div class="balance-card">
        <p class="text-gray-400 text-[10px] uppercase font-black tracking-widest mb-1">Solde Total</p>
        <h1 id="displaySolde" class="text-4xl font-black text-black">0 CDF</h1>
        
        <div class="icon-menu">
            <div class="icon-item">
                <i class="fa-solid fa-sack-dollar"></i>
                <span>Recharger</span>
            </div>
            <div class="icon-item">
                <i class="fa-solid fa-cash-register"></i>
                <span>Retirer</span>
            </div>
            <div class="icon-item">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>Historique</span>
            </div>
        </div>
    </div>

    <div class="px-6 mt-8">
        <h3 class="text-[11px] font-black uppercase text-gray-400 mb-4 tracking-widest flex items-center gap-2">
            <i class="fa-solid fa-microchip"></i> Mes équipements actifs
        </h3>
        <div id="listeMesProduits" class="space-y-3">
            </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-link">
            <i class="fa-solid fa-house text-2xl mb-1"></i><br>Accueil
        </a>
        <a href="produit.html" class="nav-link">
            <i class="fa-solid fa-camera text-2xl mb-1"></i><br>Produit
        </a>
        <a href="compte.html" class="nav-link active">
            <i class="fa-solid fa-user text-2xl mb-1"></i><br>Compte
        </a>
    </nav>

    <script>
        // --- SÉCURITÉ MISE À ZÉRO ---
        // Si c'est la première fois ou si on veut forcer le 0
        if (!localStorage.getItem('userSolde')) {
            localStorage.setItem('userSolde', 0);
        }

        function rafraichir() {
            // Lecture du solde
            let solde = parseFloat(localStorage.getItem('userSolde')) || 0;
            document.getElementById('displaySolde').innerText = solde.toLocaleString() + " CDF";

            // Lecture des produits
            let mesProduits = JSON.parse(localStorage.getItem('mesProduits')) || [];
            const container = document.getElementById('listeMesProduits');
            container.innerHTML = "";

            if (mesProduits.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 opacity-20 border-2 border-dashed border-gray-200 rounded-[2.5rem]">
                        <i class="fa-solid fa-box-open text-5xl mb-3"></i>
                        <p class="text-[10px] font-black uppercase">Aucun investissement actif</p>
                    </div>`;
            } else {
                const maintenant = new Date().getTime();
                let soldeAJour = false;

                mesProduits.forEach((p) => {
                    // Vérification des 24 heures (86400000 ms)
                    if (maintenant - p.dernierCollecte >= 86400000) {
                        solde += p.gain;
                        p.dernierCollecte = maintenant;
                        soldeAJour = true;
                    }

                    container.innerHTML += `
                        <div class="product-card">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-black rounded-2xl flex items-center justify-center text-white font-bold text-[10px]">VIP</div>
                                <div>
                                    <p class="font-black text-xs uppercase text-black">${p.nom}</p>
                                    <p class="text-[10px] text-green-600 font-bold">+${p.gain.toLocaleString()} CDF / 24h</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] font-black text-blue-500 uppercase italic tracking-tighter">En cours</p>
                            </div>
                        </div>`;
                });

                if (soldeAJour) {
                    localStorage.setItem('userSolde', solde);
                    localStorage.setItem('mesProduits', JSON.stringify(mesProduits));
                    document.getElementById('displaySolde').innerText = solde.toLocaleString() + " CDF";
                }
            }
        }

        // Lancement immédiat
        rafraichir();
        // Vérification automatique toutes les 30 secondes
        setInterval(rafraichir, 30000);
    </script>
</body>
</html>
