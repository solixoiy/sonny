<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONNY | Mon Équipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            margin: 0; 
            font-family: -apple-system, sans-serif; 
            background: url('IMG_3730.jpeg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        
        /* Overlay pour rendre l'arrière-plan plus pro */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            z-index: -1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .tab-active {
            background: #000 !important;
            color: #fff !important;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid #eee; z-index: 1000;
        }
    </style>
</head>
<body class="pb-24">
    <div class="overlay"></div>

    <div class="pt-10 pb-20 text-center">
        <h1 class="text-3xl font-black italic uppercase tracking-tighter">Mon Équipe</h1>
        <p class="text-[10px] tracking-[0.4em] uppercase font-bold opacity-60">Programme de Parrainage</p>
    </div>

    <div class="px-5 space-y-6">
        <div class="glass-card p-6 -mt-10">
            <p class="text-[11px] font-black text-gray-400 uppercase mb-4 tracking-widest text-center">Invitez vos amis</p>
            
            <div class="bg-gray-50 p-4 rounded-2xl border border-dashed border-gray-300 mb-4 flex items-center justify-between">
                <div class="truncate mr-4">
                    <p class="text-[9px] text-gray-400 font-bold uppercase mb-1">Votre lien unique</p>
                    <span id="linkSpan" class="text-xs font-bold text-black">https://sony8-drc.github.io/sonny/register?ref=...</span>
                </div>
                <button onclick="copyInvite()" class="bg-black text-white text-[10px] font-black px-4 py-3 rounded-xl shadow-lg active:scale-95 transition-all">COPIER</button>
            </div>
            
            <p class="text-center text-[10px] font-bold text-gray-500 uppercase">Code d'invitation : <span id="codeSpan" class="text-black font-black">----</span></p>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="glass-card p-5 text-center">
                <i class="fa-solid fa-coins text-yellow-500 mb-2"></i>
                <p class="text-[9px] font-black text-gray-400 uppercase">Commissions</p>
                <p id="totalComm" class="text-xl font-black">0 CDF</p>
            </div>
            <div class="glass-card p-5 text-center">
                <i class="fa-solid fa-users text-blue-500 mb-2"></i>
                <p class="text-[9px] font-black text-gray-400 uppercase">Membres</p>
                <p id="totalTeam" class="text-xl font-black">0</p>
            </div>
        </div>

        <div class="glass-card p-4">
            <div class="flex gap-2 mb-6 bg-gray-100 p-1.5 rounded-2xl">
                <button id="btn1" onclick="showLevel(1)" class="tab-active flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all">LV1 (25%)</button>
                <button id="btn2" onclick="showLevel(2)" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all text-gray-400">LV2 (2%)</button>
                <button id="btn3" onclick="showLevel(3)" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all text-gray-400">LV3 (1%)</button>
            </div>

            <div id="membersList" class="space-y-3 min-h-[200px]">
                <div class="flex flex-col items-center justify-center py-10 opacity-30">
                    <i class="fa-solid fa-user-group text-4xl mb-3"></i>
                    <p class="text-[10px] font-black uppercase">Aucun membre enregistré</p>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="https://sony8-drc.github.io/sonny/dashboard.html" class="flex flex-col items-center text-gray-400">
            <i class="fa-solid fa-house text-2xl mb-1"></i><span class="text-[10px] font-bold">Accueil</span>
        </a>
        <a href="https://sony8-drc.github.io/sonny/produit.html" class="flex flex-col items-center text-gray-400">
            <i class="fa-solid fa-camera text-2xl mb-1"></i><span class="text-[10px] font-bold">Produit</span>
        </a>
        <a href="https://sony8-drc.github.io/sonny/equipe.html" class="flex flex-col items-center text-black">
            <i class="fa-solid fa-users text-2xl mb-1"></i><span class="text-[10px] font-bold">Équipe</span>
        </a>
        <a href="https://sony8-drc.github.io/sonny/compte.html" class="flex flex-col items-center text-gray-400">
            <i class="fa-solid fa-user text-2xl mb-1"></i><span class="text-[10px] font-bold">Compte</span>
        </a>
    </nav>

    <script>
        // 1. Initialisation du Code d'invitation
        let userCode = localStorage.getItem('sonnyInviteCode');
        if(!userCode) {
            userCode = "SNY" + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('sonnyInviteCode', userCode);
        }
        document.getElementById('codeSpan').innerText = userCode;
        document.getElementById('linkSpan').innerText = "https://sony8-drc.github.io/sonny/register?ref=" + userCode;

        // 2. Fonction Copier
        function copyInvite() {
            const link = document.getElementById('linkSpan').innerText;
            navigator.clipboard.writeText(link);
            alert("Lien de parrainage copié !");
        }

        // 3. Gestion des onglets
        function showLevel(lvl) {
            // Reset styles
            [1, 2, 3].forEach(n => {
                document.getElementById('btn'+n).classList.remove('tab-active');
                document.getElementById('btn'+n).classList.add('text-gray-400');
            });
            // Active current
            document.getElementById('btn'+lvl).classList.add('tab-active');
            document.getElementById('btn'+lvl).classList.remove('text-gray-400');
            
            // Logique d'affichage des membres (à connecter à Firebase plus tard)
            const list = document.getElementById('membersList');
            list.innerHTML = `<div class="flex flex-col items-center justify-center py-10 opacity-30">
                <i class="fa-solid fa-user-group text-4xl mb-3"></i>
                <p class="text-[10px] font-black uppercase">Aucun membre au niveau ${lvl}</p>
            </div>`;
        }

        // 4. Initialisation des données
        document.getElementById('totalComm').innerText = (parseFloat(localStorage.getItem('totalCommissions')) || 0).toLocaleString() + " CDF";
        document.getElementById('totalTeam').innerText = (parseInt(localStorage.getItem('teamSize')) || 0);
    </script>
</body>
</html>
