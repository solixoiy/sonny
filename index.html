<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONNY | Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: url('IMG_3676.jpeg') no-repeat center center fixed;
            background-size: cover; font-family: system-ui, sans-serif;
        }
        .login-card {
            background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); width: 100%; max-width: 400px;
        }
        .input-group { background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }
        input { background: transparent; border: none; outline: none; color: white; width: 100%; padding: 14px; }
        .btn-login { background-color: #ffffff; color: #000000; font-weight: 800; transition: all 0.2s ease; }
    </style>
</head>
<body class="p-6">
    <div class="login-card p-10 rounded-[2.5rem] shadow-2xl text-center">
        <div class="mb-10">
            <h1 class="text-5xl font-black italic tracking-tighter text-white uppercase">SONNY</h1>
            <p class="text-[9px] uppercase tracking-[0.4em] text-gray-300 mt-3 font-bold">Cinema Investment</p>
        </div>

        <form id="loginForm" class="space-y-6 text-left">
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-black text-white/70 ml-1">Numéro (+243)</label>
                <div class="input-group flex items-center px-4 rounded-2xl">
                    <span class="text-white font-bold mr-2">+243</span>
                    <input type="tel" id="loginTel" placeholder="812345678" required>
                </div>
            </div>
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-black text-white/70 ml-1">Mot de passe</label>
                <div class="input-group rounded-2xl">
                    <input type="password" id="loginPass" placeholder="••••••" required>
                </div>
            </div>
            <button type="submit" id="loginBtn" class="btn-login w-full py-5 rounded-2xl text-[11px] mt-6 uppercase tracking-widest">Se Connecter</button>
        </form>

        <div class="mt-10">
            <p class="text-white/60 text-xs">Nouveau partenaire ? <a href="register.html" class="text-white font-bold underline ml-1">Créer un compte</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = "+243" + document.getElementById('loginTel').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');

            btn.innerText = "VÉRIFICATION...";
            btn.disabled = true;

            // Récupération des utilisateurs depuis ton console Firebase
            fetch('https://sonyy-9b565-default-rtdb.firebaseio.com/utilisateurs.json')
            .then(response => response.json())
            .then(data => {
                let userFound = null;
                
                // On cherche si le numéro et le mot de passe correspondent
                for (let id in data) {
                    if (data[id].telephone === phone && data[id].motDePasse === pass) {
                        userFound = { ...data[id], firebaseId: id };
                        break;
                    }
                }

                if (userFound) {
                    // Stockage des infos de session
                    localStorage.setItem('sonny_session', JSON.stringify(userFound));
                    window.location.href = "dashboard.html";
                } else {
                    alert("❌ Numéro ou mot de passe incorrect.");
                    btn.innerText = "SE CONNECTER";
                    btn.disabled = false;
                }
            })
            .catch(error => {
                alert("❌ Erreur de connexion au serveur.");
                btn.innerText = "SE CONNECTER";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
