<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONNY | Confirmation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #f4f4f7; font-family: -apple-system, sans-serif; }
        .glass-header { background: #000; color: white; border-bottom-left-radius: 2.5rem; border-bottom-right-radius: 2.5rem; }
        .input-area { 
            background: white; border: 2px solid #e5e7eb; border-radius: 1.5rem; 
            width: 100%; outline: none; transition: 0.3s;
        }
        .input-area:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .btn-shimmer {
            background: linear-gradient(90deg, #000, #333, #000);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    </style>
</head>
<body class="pb-10">

    <div class="glass-header p-10 text-center mb-8 shadow-2xl">
        <div class="mb-4 inline-block p-3 bg-white/10 rounded-full backdrop-blur-md">
            <i class="fa-solid fa-shield-halved text-2xl text-blue-400"></i>
        </div>
        <h1 class="text-2xl font-black italic uppercase tracking-tighter">Vérification</h1>
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.3em] mt-2 text-blue-200">Dernière étape de recharge</p>
    </div>

    <div class="px-6">
        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 mb-8 flex justify-between items-center relative overflow-hidden">
            <div class="absolute top-0 right-0 p-2 opacity-5"><i class="fa-solid fa-money-bill-transfer text-4xl"></i></div>
            <div class="text-left">
                <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Montant envoyé</p>
                <p id="resAmt" class="text-xl font-black text-black tracking-tighter">0 CDF</p>
            </div>
            <div class="text-right">
                <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Réseau utilisé</p>
                <p id="resNet" class="text-xs font-black text-blue-600 uppercase italic">---</p>
            </div>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-[10px] font-black uppercase text-gray-400 ml-4 mb-3 block tracking-widest">
                    <i class="fa-solid fa-envelope-open-text mr-2 text-blue-500"></i> Message de confirmation SMS
                </label>
                <textarea id="proofMessage" rows="5" placeholder="Collez ici le SMS reçu après votre transfert..." 
                class="input-area p-5 text-xs font-medium leading-relaxed bg-gray-50 border-none shadow-inner"></textarea>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-gray-400 ml-4 mb-3 block tracking-widest">
                    <i class="fa-solid fa-mobile-screen mr-2 text-blue-500"></i> Votre numéro expéditeur
                </label>
                <input type="number" id="userPhone" placeholder="08XXXXXXXX" 
                class="input-area p-5 text-sm font-black bg-gray-50 border-none shadow-inner">
            </div>

            <div class="bg-blue-50/50 border-l-4 border-blue-500 p-5 rounded-2xl mb-6">
                <div class="flex gap-3">
                    <i class="fa-solid fa-circle-info text-blue-500 mt-1"></i>
                    <p class="text-[10px] text-blue-900 font-bold leading-relaxed">
                        Notre système vérifie automatiquement l'ID de transaction contenu dans votre message. Toute tentative de fraude entraînera un blocage définitif du compte.
                    </p>
                </div>
            </div>

            <button onclick="validerRecharge()" id="btnSubmit" class="btn-shimmer w-full text-white py-5 rounded-[2rem] font-black uppercase tracking-[0.2em] text-xs shadow-xl active:scale-95 transition-all">
                Confirmer le dépôt
            </button>
        </div>
    </div>

    <script>
        const session = JSON.parse(localStorage.getItem('sonny_session'));
        const data = JSON.parse(localStorage.getItem('temp_recharge'));
        const dbURL = "https://sonyy-9b565-default-rtdb.firebaseio.com";

        if(!data || !session) window.location.href = "recharge.html";

        document.getElementById('resAmt').innerText = data.amount.toLocaleString() + " CDF";
        document.getElementById('resNet').innerText = data.method;

        async function validerRecharge() {
            const proof = document.getElementById('proofMessage').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const btn = document.getElementById('btnSubmit');

            if(proof.length < 15 || phone.length < 9) {
                alert("❌ Erreur : Veuillez coller le message SMS complet et entrer votre numéro de téléphone.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Envoi en cours...';

            // Objet de la demande envoyé à Firebase
            const rechargeRequest = {
                userId: session.firebaseId,
                telephoneCompte: session.telephone,
                numeroExpediteur: phone,
                montant: data.amount,
                reseau: data.method,
                messagePreuve: proof,
                date: new Date().toISOString(),
                status: "EN ATTENTE",
                vu: false
            };

            try {
                // Envoi vers le dossier /recharges/ sur ton console
                const response = await fetch(`${dbURL}/recharges.json`, {
                    method: 'POST',
                    body: JSON.stringify(rechargeRequest)
                });

                if(response.ok) {
                    alert("✅ Demande envoyée ! Votre compte sera crédité après vérification du message (Généralement 5 à 30 min).");
                    localStorage.removeItem('temp_recharge'); // Nettoyage
                    window.location.href = "compte.html";
                } else {
                    throw new Error();
                }
            } catch (e) {
                alert("❌ Erreur de connexion. Vérifiez votre internet et réessayez.");
                btn.disabled = false;
                btn.innerHTML = "Réessayer la validation";
            }
        }
    </script>
</body>
</html>
