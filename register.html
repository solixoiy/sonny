<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONNY | Inscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #000 url('IMG_3676.jpeg') no-repeat center center fixed;
            background-size: cover; font-family: system-ui, sans-serif;
        }
        .register-card {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 400px;
        }
        .input-group { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        input { background: transparent; border: none; outline: none; color: white; width: 100%; padding: 14px; }
        input::placeholder { color: rgba(255,255,255,0.4); }
    </style>
</head>
<body class="p-6">
    <div class="register-card p-8 rounded-[2.5rem] shadow-2xl text-center">
        <div class="mb-8">
            <h1 class="text-5xl font-black italic tracking-tighter text-white uppercase">SONNY</h1>
            <p class="text-[9px] uppercase tracking-[0.4em] text-blue-400 mt-2 font-bold italic">Nouveau Compte RDC</p>
        </div>

        <form id="regForm" class="space-y-4 text-left">
            <div>
                <label class="text-[10px] uppercase font-black text-white/70 ml-1 tracking-widest">Numéro (+243)</label>
                <div class="input-group flex items-center px-4 rounded-2xl">
                    <span class="text-white font-bold mr-2">+243</span>
                    <input type="tel" id="tel" placeholder="812345678" maxlength="9" required>
                </div>
            </div>
            
            <div class="space-y-3">
                <input type="password" id="p1" placeholder="Mot de passe (6 car.)" maxlength="6" class="input-group px-4 rounded-2xl w-full" required>
                <input type="password" id="p2" placeholder="Confirmer mot de passe" maxlength="6" class="input-group px-4 rounded-2xl w-full" required>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] uppercase font-black text-white/70 ml-1 tracking-widest">Code Invitation</label>
                <input type="text" id="inv" placeholder="Code de parrainage" class="input-group px-4 rounded-2xl w-full font-bold text-blue-400" required>
            </div>

            <button type="submit" id="submitBtn" class="bg-white text-black font-black w-full py-4 rounded-2xl text-[11px] uppercase mt-4 shadow-xl active:scale-95 transition-all">
                Créer mon compte
            </button>
        </form>

        <div class="mt-8 text-center text-white/40 text-xs">
            Déjà inscrit ? <a href="index.html" class="text-white font-bold underline ml-1 italic text-blue-400">Se connecter</a>
        </div>
    </div>

    <script>
        // --- 1. FONCTION POUR RÉCUPÉRER LE CODE DANS L'URL ---
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref'); // Cherche ?ref=...
            
            if (refCode) {
                const invInput = document.getElementById('inv');
                invInput.value = refCode;
                // Optionnel : On peut le mettre en lecture seule pour éviter que l'utilisateur le change
                // invInput.readOnly = true; 
                console.log("Code de parrainage détecté : " + refCode);
            }
        };

        // --- 2. GESTION DE L'INSCRIPTION ---
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('tel').value;
            const pass1 = document.getElementById('p1').value;
            const pass2 = document.getElementById('p2').value;
            const inviteCode = document.getElementById('inv').value;
            const btn = document.getElementById('submitBtn');

            if(pass1.length < 6) {
                alert("❌ Le mot de passe doit faire 6 chiffres.");
                return;
            }

            if(pass1 !== pass2) {
                alert("❌ Les mots de passe ne correspondent pas !");
                return;
            }

            btn.innerText = "PATIENTEZ...";
            btn.disabled = true;

            const userData = {
                telephone: "+243" + phone,
                motDePasse: pass1,
                parrain: inviteCode, // On enregistre qui est le parrain
                solde: 0,
                dateInscription: new Date().toISOString(),
                status: "Actif"
            };

            fetch('https://sonyy-9b565-default-rtdb.firebaseio.com/utilisateurs.json', {
                method: 'POST',
                body: JSON.stringify(userData)
            })
            .then(res => {
                if(res.ok) {
                    alert("✅ Bienvenue sur SONNY RDC !");
                    window.location.href = "index.html";
                } else { throw new Error(); }
            })
            .catch(() => {
                alert("❌ Erreur. Vérifiez votre connexion.");
                btn.innerText = "S'INSCRIRE";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
